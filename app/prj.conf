# STruCpp emits C++17 and uses standard-library containers and utilities.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Embedded runtime faults are handled by src/strucpp_fault.cpp.
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Arduino Opta relay and status LED outputs.
CONFIG_GPIO=y

# MCUmgr over the Opta M7 USB CDC-ACM UART. The board devicetree already
# assigns the CDC-ACM device to the zephyr,uart-mcumgr chosen node, so MCUmgr
# can share the USB serial port with the console using SMP-over-console framing.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Firmware upload to MCUboot's secondary slot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# MCUmgr OS group
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y

# echo
CONFIG_MCUMGR_GRP_OS_ECHO=y

# Task/thread statistics
CONFIG_THREAD_MONITOR=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y

# Heap statistics
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=32
CONFIG_MCUMGR_GRP_OS_MPSTAT=y

# Reset
CONFIG_REBOOT=y

# MCUmgr parameters
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y

# Application / uname-style information
CONFIG_MCUMGR_GRP_OS_INFO=y

# Bootloader information
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y

# Increase buffer size for mcumgr smp access
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_UART_MTU=4096
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192
