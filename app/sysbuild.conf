# Build upstream MCUboot together with the RetroPLC application.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Uploaded images begin in the second sector of the equal-sized secondary slot.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y

# Development configuration: validate image hashes without requiring keys.
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
