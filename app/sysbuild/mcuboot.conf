# MCUboot accesses both internal flash banks during an offset swap.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# The Opta board's console is a USB CDC device which is initialized only by the
# main application. MCUboot does not expose a console or serial recovery port.
CONFIG_CONSOLE=n

# Derive the sector count from the 128 KiB internal-flash erase geometry.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y
